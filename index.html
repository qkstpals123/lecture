<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIKU & SEMIN | Sweet D-Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="noise-overlay"></div>
    
    <main class="app-container">
        <header class="header">
            <h1 class="title">RIKU & SEMIN</h1>
            <p class="subtitle">Counting down to our sweet meeting!</p>
        </header>

        <section class="dday-card">
            <div class="dessert-decoration donut" aria-hidden="true">🍩</div>
            <div class="dessert-decoration cake" aria-hidden="true">🍰</div>
            <div class="dessert-decoration taiyaki" aria-hidden="true">🐟</div>

            <div class="input-group">
                <label for="meeting-date" class="label">When is our meeting date?</label>
                <input type="date" id="meeting-date" class="date-input">
                <button id="confirm-btn" class="confirm-btn">Confirm ✨</button>
            </div>

            <div id="result-container" class="result-container hidden">
                <h2 class="result-title">D-Day</h2>
                <div id="dday-value" class="dday-value">--</div>
                <p id="dday-message" class="dday-message"></p>
            </div>
        </section>

        <footer class="footer">
            <p>Made with love for RIKU & SEMIN 🍮</p>
        </footer>
    </main>

    <script src="main.js" type="module"></script>
</body>
</html>
